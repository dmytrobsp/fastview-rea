name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref cancels the run still going for an older
# one; a tag's run (a release) is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Publish guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No original binaries, raw decompilation / disassembly output or
      # non-approved identities anywhere in the history.
      - run: python3 -I tools/publish_guard.py --all
      # The milestone helper's own tests (cheap; tools/ changes alone skip the builds).
      - run: python3 -I -m unittest discover -s tools/milestone -p 'test_*.py'

  # Whether anything that is built changed since the last commit whose
  # checks passed: notes, docs, tools, indexes or Markdown alone skip the checks
  # and builds (the guard above still runs). The base is that commit, not
  # the push's parent, because a newer push cancels or replaces an older
  # run, which must not leave its code unchecked. Tags, manual runs, pull
  # requests and an unknown base always build.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          build() { echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$EVENT" != push ] || [ "$REF" != refs/heads/main ]; then build; fi
          # The newest successful run on main whose «Check» jobs all passed
          # (skipped ones do not count).
          base=""
          for run in $(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=30" --jq '.workflow_runs[] | "\(.id):\(.head_sha)"'); do
            id=${run%%:*}; sha=${run##*:}
            ok=$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name | startswith("Check")) | .conclusion] | if length > 0 and all(. == "success") then "yes" else "no" end')
            if [ "$ok" = yes ]; then base=$sha; break; fi
          done
          if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" "$AFTER" 2>/dev/null; then build; fi
          echo "checked last at $base"
          files=$(git diff --name-only "$base" "$AFTER")
          echo "$files"
          # The files outside notes / tools / indexes / Markdown, collected
          # rather than tested with `grep -q` (whose early exit fails a
          # pipe's writer under pipefail).
          built=$(grep -vE '^(notes/|docs/|tools/|index/|\.github/ISSUE_TEMPLATE/)|\.md$' <<< "$files" || true)
          if [ -n "$built" ]; then build; fi
          echo "code=false" >> "$GITHUB_OUTPUT"
          echo "::notice::notes / tools / docs only since $base: checks and builds skipped"

  check:
    name: Check (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Every run restores main's cache; only main writes one (a cache saved
      # by a tag or PR run is scoped to that ref and would only crowd out
      # main's under the 10 GB limit).
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --workspace --all-targets
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  build:
    name: Build ${{ matrix.name }}
    needs: [guard, changes, check]
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `targets`: comma-separated; more than one (macOS) are joined into
        # one universal binary with lipo — one macOS runner instead of two.
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
            exe: fastview
          - name: windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            exe: fastview.exe
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            exe: fastview
    steps:
      - uses: actions/checkout@v4
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra targets <<< "${{ matrix.targets }}"
          bins=()
          for t in "${targets[@]}"; do
            cargo build --release -p fastview-gui --target "$t"
            bins+=("target/$t/release/${{ matrix.exe }}")
          done
          mkdir -p dist
          if [ "${#bins[@]}" -gt 1 ]; then
            lipo -create -output "dist/${{ matrix.exe }}" "${bins[@]}"
            lipo -info "dist/${{ matrix.exe }}"
          else
            cp "${bins[0]}" dist/
          fi
      # The artifact holds the files themselves, flat: upload-artifact zips
      # them once with the binary at the zip's root (no nested archive).
      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          cp "dist/${{ matrix.exe }}" README.md LICENSE-MIT LICENSE-APACHE assets/fonts/LICENSE-tahoma.txt assets/fonts/LICENSE-dejavu.txt LICENSE-intel-libm.txt stage/
          test -z "$(find stage -mindepth 1 -type d)"
          ls -la stage
      - uses: actions/upload-artifact@v4
        with:
          name: fastview-${{ matrix.name }}
          path: stage/
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # One archive per platform with the binary and docs directly at its
      # root: no directory inside, no archive inside.
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p out
          for dir in artifacts/fastview-*; do
            name="$(basename "$dir")"
            files=$(cd "$dir" && ls)
            if [ -f "$dir/fastview.exe" ]; then
              (cd "$dir" && zip -9 -q "../../out/$name.zip" $files)
              entries=$(unzip -Z1 "out/$name.zip")
            else
              chmod +x "$dir/fastview"
              tar czf "out/$name.tar.gz" -C "$dir" $files
              entries=$(tar tzf "out/$name.tar.gz")
            fi
            echo "$name:"; echo "$entries"
            if echo "$entries" | grep -qE '/|\.(zip|tar|gz|tgz|7z)$'; then
              echo "::error::$name contains a directory or a nested archive"; exit 1
            fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
