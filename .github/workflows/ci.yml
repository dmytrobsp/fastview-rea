name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Publish guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No original binaries, raw decompilation / disassembly output or
      # non-approved identities anywhere in the history.
      - run: python3 -I tools/publish_guard.py --all

  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Every run restores main's cache; only main writes one (a cache saved
      # by a tag or PR run is scoped to that ref and would only crowd out
      # main's under the 10 GB limit).
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --workspace --all-targets
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  build:
    name: Build ${{ matrix.name }}
    needs: [guard, check]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: fastview
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: fastview.exe
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: fastview
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            exe: fastview
    steps:
      - uses: actions/checkout@v4
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release -p fastview-gui --target ${{ matrix.target }}
      # The artifact holds the files themselves, flat: upload-artifact zips
      # them once with the binary at the zip's root (no nested archive).
      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" README.md LICENSE-MIT LICENSE-APACHE stage/
          test -z "$(find stage -mindepth 1 -type d)"
          ls -la stage
      - uses: actions/upload-artifact@v4
        with:
          name: fastview-${{ matrix.name }}
          path: stage/
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # One archive per platform with the binary and docs directly at its
      # root: no directory inside, no archive inside.
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p out
          for dir in artifacts/fastview-*; do
            name="$(basename "$dir")"
            files=$(cd "$dir" && ls)
            if [ -f "$dir/fastview.exe" ]; then
              (cd "$dir" && zip -9 -q "../../out/$name.zip" $files)
              entries=$(unzip -Z1 "out/$name.zip")
            else
              chmod +x "$dir/fastview"
              tar czf "out/$name.tar.gz" -C "$dir" $files
              entries=$(tar tzf "out/$name.tar.gz")
            fi
            echo "$name:"; echo "$entries"
            if echo "$entries" | grep -qE '/|\.(zip|tar|gz|tgz|7z)$'; then
              echo "::error::$name contains a directory or a nested archive"; exit 1
            fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
