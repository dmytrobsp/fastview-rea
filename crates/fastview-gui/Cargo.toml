[package]
name = "fastview-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FastView — relay-protection characteristic viewer (cross-platform reconstruction)"

[[bin]]
name = "fastview"
path = "src/main.rs"

[dependencies]
fvb-core = { path = "../fvb-core" }
eframe = "0.29"
rfd = "0.14"
num-complex = "0.4"
flate2 = "1"

[target.'cfg(not(windows))'.dependencies]
# Copy's picture as an image on the system clipboard (Windows uses an EMF).
arboard = { version = "3.7", default-features = false, features = ["image-data", "wayland-data-control"] }
# The finder's delete: to the trash like the Windows shell's FOF_ALLOWUNDO.
trash = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_System_Memory", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security", "Win32_Storage_Xps", "Win32_System_Diagnostics_Debug", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# The system file dialogs' owner (rfd's parent).
raw-window-handle = "0.6"
# The software runner (W4.1c): a winit window, egui-winit's input, our
# rasteriser blitted with GDI — for Windows without OpenGL 2 / D3D 12.
winit = "0.30"
egui-winit = { version = "0.29", default-features = false, features = ["clipboard", "links"] }
